name: Excavator

on:
  workflow_dispatch:
  schedule:
    # Check for upstream Sally releases every 4 hours.
    - cron: '37 */4 * * *'

permissions:
  contents: write

jobs:
  excavate:
    name: Check and update manifests
    runs-on: windows-latest
    steps:
      - name: Check out bucket
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Scoop Excavator
        uses: ScoopInstaller/GithubActions@5bceeda181721d9d10a18fdcc3ddca6f33467ae6 # v3.0.0
        env:
          SKIP_UPDATED: 1
